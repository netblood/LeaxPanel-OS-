services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: ${APP_MEMORY_LIMIT:-768m}
    labels:
      traefik.enable: "true"
      traefik.http.routers.${APP_NAME:-n8n}.rule: Host(`${APP_DOMAIN:-n8n.localhost}`)
      traefik.http.routers.${APP_NAME:-n8n}.entrypoints: websecure
      traefik.http.routers.${APP_NAME:-n8n}.tls: "true"
      traefik.http.routers.${APP_NAME:-n8n}.tls.certresolver: leax
      traefik.http.services.${APP_NAME:-n8n}.loadbalancer.server.port: "5678"
    volumes:
      - ${APP_NAME:-n8n}_data:/home/node/.n8n
    networks:
      - leaxpanel

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${APP_NAME:-n8n}_postgres:/var/lib/postgresql/data
    mem_limit: 160m
    networks:
      - leaxpanel

volumes:
  ${APP_NAME:-n8n}_data:
  ${APP_NAME:-n8n}_postgres:

networks:
  leaxpanel:
    external: true
